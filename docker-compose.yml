services:
  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: elaris_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: elaris
      POSTGRES_PASSWORD: elaris_secret
      POSTGRES_DB: ateliercommerce
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U elaris -d ateliercommerce"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Redis ───────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: elaris_redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ── Next.js Dev Server ──────────────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: elaris_app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Reads ALL vars from your existing .env file automatically
    env_file:
      - .env
    environment:
      # Override only the DB/Redis URLs to use Docker container names
      DATABASE_URL: "postgresql://elaris:elaris_secret@db:5432/ateliercommerce?schema=public"
      DIRECT_URL:   "postgresql://elaris:elaris_secret@db:5432/ateliercommerce?schema=public"
      REDIS_URL:    "redis://redis:6379"
      # Ensure Next.js binds to all interfaces for Windows localhost and 127.0.0.1
      HOSTNAME: "0.0.0.0"
      PORT: "3000"
      # Required for hot-reload to work on Windows Docker
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "3000:3000"
    volumes:
      - ./app:/app/app
      - ./components:/app/components
      - ./config:/app/config
      - ./features:/app/features
      - ./lib:/app/lib
      - ./prisma:/app/prisma
      - ./schemas:/app/schemas

volumes:
  postgres_data:
